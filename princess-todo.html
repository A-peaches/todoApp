<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>₊‧Todo‎♡‧₊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
@font-face {
  font-family: 'OgRenaissanceSecret';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2312-1@1.1/OG_Renaissance_Secret-Rg.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}
/* Layout: 얼음 궁전 다이어리 — 금빛 메달리온 헤더, 서리유리 카드(리본 탭 + 영문 이탤릭 제목), 2열 상단, 날씨 3칸, 2주 달력 타일, 서리유리 하단 탭바. 눈송이가 천천히 내림 */
:root {
  color-scheme: light;
  --sky: #eef1fb;
  --blush: #fbe9f1;
  --lilac: #e7e0f6;
  --ice: #cbd8f2;
  --rose: #c95a86;
  --rose-soft: #f7d5e3;
  --gold: #bf9a48;
  --gold-hi: #f1dc9e;
  --silver: #b9c0d6;
  --ink: #4c2f45;
  --muted: #8f7a92;
  --frost: rgba(255, 255, 255, .78);
  --f-kr-display: "Gowun Batang", "Noto Serif KR", serif;
  --f-en: "Cormorant Garamond", "Times New Roman", serif;
  --f-num: "OgRenaissanceSecret", "Cormorant Garamond", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--blush) 0%, var(--sky) 38%, var(--lilac) 75%, var(--blush) 100%) fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 13px;
  word-break: keep-all;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(100px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}

/* 헤더: 캘린더 아이콘 + 날짜 한 줄 */
.head { display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 10px; }
.cal-ico { width: 42px; height: 44px; flex: none; filter: drop-shadow(0 4px 8px rgba(191,154,72,.3)); }
.head-text { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.15; }
.date { font-family: var(--f-en); font-weight: 600; font-size: 29.5px; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.en-sub { font-family: var(--f-en); font-style: italic; font-size: 13px; color: var(--muted); letter-spacing: .02em; }

/* 서리유리 카드 */
.card {
  position: relative;
  background: var(--frost);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 26px;
  box-shadow: 0 0 0 1px var(--rose-soft), 0 12px 28px rgba(140, 110, 170, .14);
}
.card::after { /* 안쪽 은빛 테두리 */
  content: ""; position: absolute; inset: 5px; border-radius: 21px;
  border: 1px dashed rgba(185,192,214,.6); pointer-events: none;
}
.tab {
  position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
  width: 64px; height: 30px;
  background: linear-gradient(180deg, #e384a9, var(--rose));
  clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
  display: grid; place-items: start center; padding-top: 5px;
}
.tab svg { width: 22px; height: 14px; }
.title-en { font-family: var(--f-en); font-style: italic; font-weight: 600; font-size: 20px; color: var(--rose); line-height: 1; }
.title-kr { font-size: 10.5px; color: var(--muted); margin-top: 4px; letter-spacing: .02em; }

.top { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; align-items: stretch; }

/* 이번 주 할 일 */
.week { padding: 38px 14px 16px; min-width: 0; text-align: center; }
.todo-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 236px; overflow-y: auto; text-align: left; }
.todo-list li {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 7px; align-items: center; min-width: 0;
  padding: 7px 9px; border-radius: 12px; background: rgba(247,213,227,.35);
}
.todo-list li .t { overflow-wrap: anywhere; font-size: 12.5px; }
.todo-list li .d { font-family: var(--f-en); font-weight: 600; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo-list li svg { width: 13px; height: 12px; }
.todo-list li.today { background: linear-gradient(90deg, var(--rose-soft), rgba(241,220,158,.5)); }
.todo-list li.today .d { color: var(--rose); font-family: var(--f-body); font-size: 10.5px; font-weight: 700; }
.todo-list li[data-id] { cursor: pointer; transition: opacity .35s ease, transform .35s ease; -webkit-tap-highlight-color: transparent; }
.todo-list li[data-id]:hover { box-shadow: inset 0 0 0 1px var(--rose-soft); }
.todo-list li[data-id]:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.todo-list li.checked .t { text-decoration: line-through; text-decoration-color: var(--rose); color: var(--muted); }
.todo-list li.checked svg path { fill: var(--gold); }
.todo-list li.leaving { opacity: 0; transform: translateX(14px); }
.empty { font-family: var(--f-kr-display); color: var(--muted); padding: 10px 0; background: none !important; }
.sample-tag { display: inline-block; margin-top: 10px; font-family: var(--f-en); font-style: italic; font-size: 11px; color: var(--gold); }

/* 오른쪽 */
.side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cheer { flex: 1; padding: 36px 12px 14px; text-align: center; display: flex; flex-direction: column; justify-content: space-evenly; gap: 10px; }
.cheer p { margin: 8px 0 0; font-family: var(--f-kr-display); font-size: 13.5px; line-height: 1.55; text-wrap: balance; }
.bunny-wrap { position: relative; display: grid; place-items: center; }
#bunny { width: 104px; height: 97.5px; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
.sparkle { position: absolute; color: var(--gold); font-size: 13px; animation: twinkle 1.8s ease-in-out infinite; }
.sparkle.s2 { animation-delay: .6s; font-size: 9px; }
.sparkle.s3 { animation-delay: 1.2s; color: #9fb3e0; }
@keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

/* 날씨 + 하트 */
.mid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: stretch; }
.weather { padding: 14px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.weather .title-en { font-size: 16.5px; }
.weather svg { width: 44px; height: 38px; margin-top: 2px; }
.temps { font-family: var(--f-en); font-weight: 600; font-size: 15.5px; font-variant-numeric: tabular-nums; }
.temps .lo { color: #6f8cc4; } .temps .hi { color: var(--rose); }
.big-heart { border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.big-heart svg { width: 100%; max-width: 108px; filter: drop-shadow(0 8px 14px rgba(201,90,134,.28)); }
.big-heart.pop svg { animation: pop .5s ease; }
.heart-count { font-family: var(--f-num); font-size: 18px; line-height: 1; color: var(--rose); margin-top: 4px; font-variant-numeric: tabular-nums; }
.heart-count::before { content: "♡ "; font-family: var(--f-body); font-size: 12px; }
@keyframes pop { 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
.big-heart:focus-visible, .nav button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 12px; }

/* 2주 달력 */
.cal { padding: 38px 12px 16px; text-align: center; }
.month { font-family: var(--f-en); font-weight: 600; font-size: 14px; letter-spacing: .18em; color: var(--gold); margin: 10px 0 8px; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 4px; }
.wk { font-size: 10px; color: var(--muted); }
.wk.sun { color: var(--rose); } .wk.sat { color: #6f8cc4; }
.day {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 7px 0 6px; border-radius: 14px; background: rgba(255,255,255,.7);
  box-shadow: inset 0 0 0 1px var(--rose-soft);
}
.day .n { font-family: var(--f-en); font-weight: 600; font-size: 17.5px; line-height: 1; font-variant-numeric: tabular-nums; }
.day .c { font-family: var(--f-en); font-weight: 600; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 14px; }
.day .c.has { color: var(--rose); font-weight: 700; }
.day .c.has::before { content: "♡ "; font-weight: 400; }
.day.today { background: linear-gradient(180deg, #e88db0, var(--rose)); box-shadow: 0 0 0 2px var(--gold-hi), 0 4px 10px rgba(201,90,134,.3); color: #fff; }
.day.today .c, .day.today .c.has { color: #fff; }
.day.first { box-shadow: inset 0 0 0 1.5px var(--gold); }

/* 하단 탭바 */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: rgba(255,255,255,.82);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--rose-soft);
  box-shadow: 0 -6px 18px rgba(140,110,170,.12);
  padding-top: 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav ul { list-style: none; margin: 0 auto; padding: 0; max-width: 480px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.nav button {
  width: 100%; border: 0; background: none; cursor: pointer; color: var(--muted);
  font-family: var(--f-body); font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0;
}
.nav svg { width: 24px; height: 24px; }
.nav .ico { padding: 4px 12px; display: grid; place-items: center; border-radius: 14px; }
.nav button[aria-current="page"] { color: var(--rose); font-weight: 700; }
.nav button[aria-current="page"] .ico { background: linear-gradient(180deg, #fff, var(--rose-soft)); box-shadow: 0 0 0 1px var(--gold-hi); }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 99px; font-size: 12px; white-space: nowrap; z-index: 6; display: flex; align-items: center; gap: 10px; }
.toast[hidden] { display: none; }
.toast button { border: 0; background: none; color: var(--gold-hi); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }

/* 숫자: 눈누 'OG 르네상스 비밀' 필기체 */
.date, .todo-list li .d, .temps, .day .n, .day .c { font-family: var(--f-num); font-weight: normal; font-style: normal; }
.todo-list li.today .d { font-family: var(--f-body); }

@media (max-width: 360px) {
  .date { font-size: 26px; }
  .top { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .sparkle, .big-heart.pop svg { animation: none; }
}
</style>

<script>
(function () {
  const KEY = 'princessTodo.todos';
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const todayIso = iso(now);
  const EN_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const EN_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // ---- 로컬 저장소 ----
  function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }

  let todos = load();
  if (!todos) {
    const s = (title, off, done) => ({ id: Math.random().toString(36).slice(2), title, date: iso(addDays(now, off)), done: !!done, sample: true });
    todos = [
      s('장보기', 0), s('영어 회화 숙제', 0),
      s('본가 가기', 1), s('미용실 가기', 2),
      s('대학원 과제 제출', 4), s('AICE 공부', 4), s('관리비 내기', 4),
      s('네일 예약', 5), s('친구 생일 선물', 5),
      s('도서관 책 반납', 9), s('운동 등록', 12),
      s('세탁소 찾기', 0, true)
    ];
    save(todos);
  }

  // ---- 헤더 ----
  document.getElementById('today').textContent = now.getFullYear() + '. ' + pad(now.getMonth() + 1) + '. ' + pad(now.getDate()) + '.';
  document.getElementById('enDay').textContent = EN_DAYS[now.getDay()] + ', full of joy in my palace';

  // ---- 이번 주 할 일 ----
  const weekEnd = iso(addDays(now, 6));

  (function () {
    const cvb = document.getElementById('bunny'), g = cvb.getContext('2d');
    const GW = 32, GH = 30, P = 4, dpr = window.devicePixelRatio || 1;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28);
      ctx.fillStyle = f.gold ? 'rgba(214,180,100,.75)' : 'rgba(255,255,255,.95)';
      ctx.shadowColor = f.gold ? 'rgba(241,220,158,.9)' : 'rgba(170,190,230,.8)'; ctx.shadowBlur = 6;
      ctx.fill();
      if (!still) {
        f.y += f.s; f.w += .01; f.x += Math.sin(f.w) * .3;
        if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      }
    }
    if (!still) requestAnimationFrame(draw);
  }
  draw();
})();
</script>
